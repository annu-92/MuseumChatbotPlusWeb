<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - प्राचीनप्रवेशक</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="#"><img src="logo.jpg" class="logo" alt="Logo"></a>

        <nav>
            <div class="container">
                <ul class="nav">
                    <li><a href="#">Home</a></li> 
                    <li><a href="exploreMuseum.html" id="museumLink">Discover Museums</a></li>
                    <li><a href="events.html" id="eventLink">Events</a></li>
                    <li><a href="aboutus.html" id="aboutLink">About Us</a></li>
                    <li><a href="login.html" id="loginLink">LOGIN</a></li>
                </ul> 
            </div>
        </nav>
           
    </header>

    <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
    
    <div class="container">
        <div class="left-section"></div>
        <div class="right-section">
            <div class="login-box">
                <div class="wrapper">
                    <div class="title-text">
                        <div class="title login">Login Form</div>
                        <div class="title signup">Signup Form</div>
                    </div>
                <div class="form-container">
                  <div class="slide-controls">
                    <input type="radio" name="slide" id="login" checked>
                    <input type="radio" name="slide" id="signup">
                    <label for="login" class="slide login">Login</label>
                    <label for="signup" class="slide signup">Signup</label>
                    <div class="slider-tab"></div>
                  </div>
                  <div class="form-inner">
                    <form action="#" class="login">
                        <div class="field">
                            <input type="text" placeholder="Email Address" required>
                        </div>
                        <div class="field">
                            <input type="password" placeholder="Password" required>
                        </div>
                        <div class="pass-link">
                            <a href="forgetPassword.html">Forgot password?</a>
                        </div>
                        <div class="field btn">
                            <div class="btn-layer"></div>
                            <input type="submit" value="Login">
                        </div>
                      <div class="signup-link">Not a member? <a href="">Signup now</a></div>
                    </form>
                    <form action="#" class="signup">
                      <div class="field">
                        <input type="text" placeholder="Email Address" required>
                      </div>
                      <div class="field">
                        <input type="password" placeholder="Password" required>
                      </div>
                      <div class="field">
                        <input type="password" placeholder="Confirm password" required>
                      </div>
                      <div class="field btn">
                        <div class="btn-layer"></div>
                        <input type="submit" value="Signup">
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>

    <script>
        const loginText = document.querySelector(".title-text .login");
         const loginForm = document.querySelector("form.login");
         const loginBtn = document.querySelector("label.login");
         const signupBtn = document.querySelector("label.signup");
         const signupLink = document.querySelector("form .signup-link a");
         signupBtn.onclick = (()=>{
           loginForm.style.marginLeft = "-50%";
           loginText.style.marginLeft = "-50%";
         });
         loginBtn.onclick = (()=>{
           loginForm.style.marginLeft = "0%";
           loginText.style.marginLeft = "0%";
         });
         signupLink.onclick = (()=>{
           signupBtn.click();
           return false;
         });
   </script>
</body>
</html>
